<!DOCTYPE html>
<html>
<head>
    <title>QuadNexus Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark d-flex justify-content-center align-items-center vh-100">

<div class="card p-4 bg-secondary text-light shadow" style="width: 360px;">
    <h2 class="text-center mb-2">QuadNexus</h2>
    <p class="text-center mb-4">Admin Login</p>

    {% if error %}
        <div class="alert alert-danger text-center">
            {{ error }}
        </div>
    {% endif %}

    <form method="POST">
        <div class="mb-3">
            <input type="text" name="username" class="form-control" placeholder="Username" required>
        </div>

        <div class="mb-3 position-relative">
            <input type="password" id="password" name="password" class="form-control" placeholder="Password" required>
            <span onclick="togglePassword()" style="position:absolute; right:15px; top:50%; transform:translateY(-50%); cursor:pointer;">
                👁
            </span>
        </div>

        <button type="submit" class="btn btn-dark w-100">Login</button>
    </form>
</div>

<script>
function togglePassword() {
    const passwordField = document.getElementById("password");
    passwordField.type = passwordField.type === "password" ? "text" : "password";
}
</script>

</body>
</html>
