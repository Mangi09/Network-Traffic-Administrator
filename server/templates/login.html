<!DOCTYPE html>
<html>
<head>
    <title>QuadNexus Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background: #f4f7f6;" class="d-flex justify-content-center align-items-center vh-100">

<div class="card p-4 bg-white text-dark shadow-sm" style="width: 360px; border: 1px solid #e0e0e0; border-radius: 8px;">
    <h2 class="text-center mb-2" style="color: #007c91; font-weight: bold;">QuadNexus</h2>
    <p class="text-center mb-4 text-muted">Admin Login</p>

    {% if error %}
        <div class="alert alert-danger text-center py-2 small">
            {{ error }}
        </div>
    {% endif %}

    <form method="POST">
        <div class="mb-3">
            <label class="form-label small text-muted mb-1">Username</label>
            <input type="text" name="username" class="form-control" placeholder="Enter username" required>
        </div>

        <div class="mb-3 position-relative">
            <label class="form-label small text-muted mb-1">Password</label>
            <input type="password" id="password" name="password" class="form-control" placeholder="Enter password" required>
            <span onclick="togglePassword()" style="position:absolute; right:15px; top:38px; cursor:pointer; color: #666;">
                👁
            </span>
        </div>

        <button type="submit" class="btn w-100 mt-2" style="background-color: #007c91; color: white;">Login</button>
    </form>
</div>

<script>
function togglePassword() {
    const passwordField = document.getElementById("password");
    passwordField.type = passwordField.type === "password" ? "text" : "password";
}
</script>

</body>
</html>
