<!DOCTYPE html>
<html>

<head>
    <title>QuadNexus Network Activity</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root {
            --bg-color: #f4f7f6;
            --text-color: #333;
            --card-bg: white;
            --card-border: #e0e0e0;
            --table-header-bg: #f8f9fa;
            --table-header-text: #555;
            --muted-text: #6c757d;
        }

        body.dark-mode {
            --bg-color: #121212;
            --text-color: #ffffff;
            --card-bg: #1e1e1e;
            --card-border: #333;
            --table-header-bg: #252525;
            --table-header-text: #bbb;
            --muted-text: #bbb;
        }

        body {
            background: var(--bg-color);
            color: var(--text-color);
            transition: background 0.3s, color 0.3s;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .navbar-custom {
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-custom {
            background: var(--card-bg);
            border-radius: 8px;
            padding: 20px;
            border: 1px solid var(--card-border);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        .table {
            color: var(--text-color) !important;
            --bs-table-bg: transparent !important;
            --bs-table-border-color: var(--card-border) !important;
        }

        .protocol-badge {
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        .protocol-https {
            background: rgba(25, 118, 210, 0.2);
            color: #1976d2;
        }

        body.dark-mode .protocol-https {
            color: #90caf9;
        }

        .client-name {
            font-weight: 700;
            color: #007c91;
        }

        .filter-select,
        .filter-input {
            background-color: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--card-border);
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 0.9rem;
        }
    </style>
</head>

<body>
    <div class="navbar-custom">
        <h3 class="fw-bold mb-0">QuadNexus</h3>
        <div class="d-flex gap-2 align-items-center">
            <button id="themeToggle" class="btn btn-outline-secondary btn-sm shadow-sm"><i
                    class="bi bi-moon-stars me-1"></i>Theme</button>
            <a href="/dashboard" class="btn btn-outline-primary btn-sm shadow-sm"><i
                    class="bi bi-speedometer2 me-1"></i>Dashboard</a>
            <a href="/graphs" class="btn btn-outline-primary btn-sm shadow-sm"><i
                    class="bi bi-graph-up-arrow me-1"></i>Graphs</a>
            <a href="/logout" class="btn btn-outline-danger btn-sm shadow-sm"><i
                    class="bi bi-box-arrow-right me-1"></i>Logout</a>
        </div>
    </div>

    <div class="container-fluid px-4">
        <div class="card-custom">
            <h4 class="fw-bold mb-4">Network Activity</h4>

            <div class="row g-3 mb-4 p-3 rounded" style="background: rgba(0,0,0,0.03);">
                <div class="col-md-4">
                    <label class="small fw-bold mb-1 d-block text-muted">Search PC No.</label>
                    <input type="text" id="searchPC" class="filter-input w-100" placeholder="e.g. PC-1">
                </div>
                <div class="col-md-4">
                    <label class="small fw-bold mb-1 d-block text-muted">Protocol</label>
                    <select id="protocolFilter" class="filter-select w-100">
                        <option value="all">All Protocols</option>
                        <option value="HTTPS">HTTPS</option>
                        <option value="HTTP">HTTP</option>
                        <option value="DNS">DNS</option>
                        <option value="OTHER">OTHER</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="small fw-bold mb-1 d-block text-muted">Date</label>
                    <input type="date" id="dateFilter" class="filter-input w-100">
                </div>
            </div>

            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead>
                        <tr class="text-uppercase small fw-bold" style="color: var(--muted-text);">
                            <th>Time</th>
                            <th>Source Client</th>
                            <th>Destination</th>
                            <th>Type</th>
                            <th class="text-end">Payload</th>
                        </tr>
                    </thead>
                    <tbody id="logsTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let allLogs = [];

        function formatBytes(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        async function loadLogs() {
            try {
                const response = await fetch('/api/network_logs');
                allLogs = await response.json();
                applyFilters();
            } catch (error) {
                console.error('Error loading logs:', error);
            }
        }

        function applyFilters() {
            const pc = document.getElementById('searchPC').value.toLowerCase();
            const proto = document.getElementById('protocolFilter').value;
            const date = document.getElementById('dateFilter').value;

            const filtered = allLogs.filter(l => {
                const matchesPC = l.client.toLowerCase().includes(pc);
                const matchesProto = proto === 'all' || l.protocol === proto;
                const matchesDate = !date || l.time.startsWith(date);
                return matchesPC && matchesProto && matchesDate;
            });

            renderTable(filtered);
        }

        function renderTable(data) {
            const body = document.getElementById('logsTableBody');
            body.innerHTML = data.map(l => `
                <tr>
                    <td class="small text-muted">${l.time}</td>
                    <td>
                        <div class="client-name">${l.client}</div>
                        <div class="small text-muted">${l.ip}</div>
                    </td>
                    <td class="small text-truncate" style="max-width: 250px;">${l.domain}</td>
                    <td><span class="protocol-badge protocol-${l.protocol.toLowerCase()}">${l.protocol}</span></td>
                    <td class="text-end fw-bold">${formatBytes(l.bytes)}</td>
                </tr>
            `).join('');
        }

        // Theme Toggle
        const themeToggle = document.getElementById('themeToggle');
        if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark-mode');
        themeToggle.onclick = () => {
            document.body.classList.toggle('dark-mode');
            localStorage.setItem('theme', document.body.classList.contains('dark-mode') ? 'dark' : 'light');
        };

        document.getElementById('searchPC').oninput = applyFilters;
        document.getElementById('protocolFilter').onchange = applyFilters;
        document.getElementById('dateFilter').onchange = applyFilters;

        loadLogs();
        setInterval(loadLogs, 3000);
    </script>
</body>

</html>
